schema: agents-workflows/v2
purpose: "Fixture for a valid workflow document."
owns: "Fixture ownership text."
read_first: []
startup:
  controller: "Classify from compact route index and expand named route only."
  common_task_matrix:
    enterprise_dispatch: "Use only for organization, department, employee dispatch, or model binding work."
    workflow_artifact: "Use only for workflow artifacts, packets, approval gates, collection, or simulations."
    context_compact: "Use only for context compaction, handoff, resume, or employee closeout summaries."
    context_intelligence: "Use only for minimal context, impact analysis, provenance, freshness, or verification recommendations."
  fast_classification:
    enterprise_dispatch: "Read enterprise files only when the task names department dispatch."
    workflow_artifact: "Read workflow artifact files only when artifacts or simulations are requested."
    context_compact: "Read context compact files only when compact or handoff artifacts are requested."
    context_intelligence: "Read context intelligence files only for stateful route, scope, impact, or verification decisions."
progress_updates:
  cap: "Fixture update cap."
memory: "Read docs/memory/index.md first; open at most three matching active entries; verify source_commit/content_hash/checked_at/update_trigger/supersedes/boundary; current evidence wins."
multi_agent_runtime:
  do_not_trigger_for: []
  delegation_gate: "Use independent parallel work only when value exceeds context/coordination/integration cost; keep one controller."
  batch_ack:
    assignment_contract: "No side effects; stable id; compact output."
    compact_ack_schema: '{"id":"001","ok":true,"msg":"hello"}'
    validation: ["expected id set", "missing/duplicate/invalid-format/wrong-id", "protocol"]
    ledger_rule: "Record batch summary plus exceptions."
    closeout_fields: ["requested", "completed", "missing", "failed", "risk"]
  fast_spawn:
    queue_rule: "Fixture queue rule."
    close_rule: "Fixture close rule."
    ledger_rule: "Fixture ledger rule."
  runtime:
    cleanup_helper: "Use scripts/agents-cleanup.ps1 for exact runtime id Verify/Cleanup evidence; never sidebar nicknames."
  lifecycle_checks:
    before: []
    during: []
    after: []
  ownership:
    hard_fail: []
  roster:
    project_local_ledger: ".agents/runtime/agent-ledger.jsonl"
    temp_cache: "%TEMP%/codex-agent-status/<project-id>/"
    required_when: []
  report_dedupe:
    dedupe_key: "Fixture dedupe key."
scoring_batches:
  validity_outcomes: "Fixture validity outcomes."
  aggregation:
    cap_rule: "Fixture cap rule."
enterprise_dispatch_runtime:
  source_of_truth: "docs/agents/dispatch.yaml owns enterprise dispatch semantics."
  trigger_when: ["department dispatch", "model binding"]
  do_not_trigger_for: ["answer-only", "single scoped edit"]
  controller_assignment: "Controller sends assignments only to department leaders."
  department_leader_dispatch: "Department leaders own worker split, checks, and summary."
  internal_workers: "Workers report to the department leader."
  department_report: "Leader reports worker_count, objective_result, files_changed, risks, escalations, and evidence to controller."
  model_policy: "Use tier names before replaceable concrete model IDs."
  escalation: "Create escalation_record for direct controller reports or unverified work."
  validation: "Require department, leader, model tier, report target, and escalation_record rules."
workflow_artifact_runtime:
  source_of_truth: "docs/agents/workflow-artifacts.yaml owns workflow artifact semantics."
  trigger_when: ["workflow artifacts", "packet collection", "dispatch simulation"]
  do_not_trigger_for: ["answer-only", "enterprise dispatch without artifacts"]
  storage_rule: ".agents/runtime/workflows and .workflow are runtime-local; never commit them."
  controller_rule: "Controller integrates department reports and excludes raw worker chatter."
  approval_gate_rule: "write, deploy, external access, destructive action, and model tier upgrade require approval or escalation."
  collection_rule: "Collect normalized results, department reports, verification packets, and escalation records."
  simulation_rule: "Level 1-3 are positive smoke tests; Level 4 and Level 6 are guardrails."
context_compact_runtime:
  source_of_truth: "docs/agents/context-compact.yaml owns context compact semantics."
  trigger_when: ["context compaction", "handoff", "resume", "subagent closeout"]
  summary_rule: "Preserve latest_user_request, context_evidence_ref, verification_state, open_risks, and next_step."
  raw_content_rule: "Exclude raw transcript and raw worker chatter."
  runtime_rule: ".agents/runtime/compact-events.jsonl stays local; never stage it. Promote reusable verified lessons; stale memory cannot override current evidence."
context_intelligence_runtime:
  source_of_truth: "docs/agents/context-intelligence.yaml owns minimal-context and impact-evidence semantics."
  resolver_rule: "scripts/resolve-agent-context.ps1 returns at most three files/8192 bytes; expand on gaps."
  evidence_rule: "Record provenance/confidence/hash/freshness, dependency paths, affected tests, gaps, and verification recommendation; heuristics cannot alone authorize edits or skipped verification."
  fallback_rule: "Dirty, stale, degraded, unsupported, parse-error, or conflicting evidence: expand reads + Full; never continue silently. Ignore .agents/runtime/context-intelligence/ Git state/content hashes; never stage/deploy/release it. Ledger keeps current route, verified assumptions, change boundary, remaining steps, recovery pointers; avoid full-repo rescan."
handoff:
  project_id: "fixture-project"
deployment:
  delegated_worker: "For deploy-to-path requests, assign one deployment_worker with target path, mode, dry-run/write scope, and no app-code/OS-permission repair authority."
  upgrade: "Fixture dry-run first deployed_file_set rule."
skill_authoring: {}
maintenance:
  local_permission_boundary: []
  verification_profiles:
    change_aware: "validate-changes.ps1 uses ContextMode Auto for Fast/Policy/Full; Required for release evidence; checkpoint gates remain full."
    release_deploy_push_audit: "Fixture release profile."
  local_only: []
closeout:
  compact_handoff: "Fixture compact handoff summary."
